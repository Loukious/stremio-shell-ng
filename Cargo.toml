[package]
name = "stremio-shell-ng"
version = "5.0.23"
edition = "2018"

[dependencies]
once_cell = "1.19"
native-windows-gui = { git = "https://github.com/Stremio/native-windows-gui", features = [
    "high-dpi",
    "notice",
    "tray-notification",
    "menu",
    "timer",
] }
native-windows-derive = "1"
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "dwmapi",
    "dxgi",
    "dxgiformat",
    "dxgitype",
    "libloaderapi",
    "handleapi",
    "jobapi2",
    "wincon",
    "winuser",
    "wingdi",
    "namedpipeapi",
    "winreg",
    "wingdi",
] }
webview2 = "0.1.4"
webview2-sys = "0.1.1"
libmpv2 = "5.0.3"
libmpv2-sys = "4.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive", "unicode"] }
open = "5"
urlencoding = "2.1.3"
bitflags = "2"
parse-display = "0.9"
flume = "0.11"
whoami = "1.5"
anyhow = "1"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.12.12", features = ["stream", "json", "blocking"] }
rand = "0.10"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
souvlaki = "0.8"
discord-rich-presence = "1.1.0"
rust-ini = "0.21"
steamworks = "0.13"

[build-dependencies]
winres = "0.1"
chrono = "0.4.22"
zip-extract = "0.4"
[dev-dependencies]
serde_test = "1.0.*"
