[Buttons]
# Show buttons in Rich Presence
# true: Show buttons; false: Do not show buttons
show_buttons = true

# Redirect links to the web version or the app
# options: web, app
link_target = app

[Activity]
# Disable activity if in the menu
# true: Do not show activity in the menu; false: Show activity even in the menu
disable_in_menu = false

# Disable activity if the video is paused
# true: Do not show activity when paused; false: Show activity even when paused
disable_when_paused = false

# Interval (in seconds) for refreshing Rich Presence
# 1-60
refresh_interval = 5

# Show the small play/pause icon in the activity
show_small_image = true

# Swap the values shown in Discord's activity name and details/title fields
# false: show/movie name first; true: episode/title first
swap_name_and_title = false

[Lobby]
# Max watch party size
# 2-16
lobby_max_size = 8

[AutoSkip]
# Master switch for auto-skipping segments
# true: enabled; false: disabled
enabled = true

# Which segments to auto-skip
skip_intro = true
skip_recap = true

# "Outro" here means end credits / post-credits (mapped to "credits" on TheIntroDB)
skip_outro = true

[AutoSkipChapters]
# Comma-separated keywords matched against the current chapter title (case-insensitive).
# If the chapter title contains any keyword in a list, it will jump to the next chapter.
# Each list is gated by [AutoSkip] skip_intro/skip_recap/skip_outro.
# Leave a value blank to disable matching for that kind.
intro = opening,op,op1,op2,op 1,op 2,intro,introduction,prologue,pre-opening,pre opening,opening theme,opening credits,title sequence,logo,studio logo
recap = recap,recapitulation,previously,previously on,last time,story so far,summary,digest
outro = ending,ed,ed1,ed2,ed 1,ed 2,outro,credits,end credits,ending credits,closing,closing credits,ending theme,staff roll,cast

[IntroDB]
# Optional API key for introdb.app (reads are anonymous, leave blank)
api_key =

[TheIntroDB]
# Optional API key for api.theintrodb.org (Authorization: Bearer <api_key>)
# Leave blank for anonymous access
api_key =
