name: Build Windows artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose release candidate
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.rc.outputs.base_version }}
      package_version: ${{ steps.rc.outputs.package_version }}
      tag: ${{ steps.rc.outputs.tag }}
      rc_number: ${{ steps.rc.outputs.rc_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose release candidate version
        id: rc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          manifest_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          base_version="${manifest_version%%-rc*}"
          base_tag="v${base_version}"
          current_tag=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            current_tag="${GITHUB_REF_NAME}"
          fi

          if [[ "$current_tag" =~ ^v(.+)-rc([0-9]+)$ ]]; then
            release_tag="$current_tag"
            package_version="${release_tag#v}"
            base_version="${package_version%-rc*}"
          else
            git fetch --tags --force
            existing_numbers="$(
              {
                git tag -l "${base_tag}-rc*" | sed -En "s/^${base_tag}-rc([0-9]+)$/\1/p"
                gh release list --limit 200 --json tagName --jq '.[].tagName' \
                  | sed -En "s/^${base_tag}-rc([0-9]+)$/\1/p"
              } | sort -n | uniq
            )"
            last_number="$(printf '%s\n' "$existing_numbers" | tail -n 1)"
            if [[ -z "$last_number" ]]; then
              next_number=1
            else
              next_number=$((last_number + 1))
            fi
            release_tag="${base_tag}-rc${next_number}"
            package_version="${release_tag#v}"
          fi

          rc_number="${release_tag##*-rc}"
          {
            echo "base_version=${base_version}"
            echo "package_version=${package_version}"
            echo "tag=${release_tag}"
            echo "rc_number=${rc_number}"
          } >> "$GITHUB_OUTPUT"

          echo "Selected release candidate: ${release_tag} (package ${package_version})"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
            cargo_args: ""
            setup_script: setup\Stremio.iss
            setup_glob: StremioSetup-v*_x64.exe
            include_steam: true
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            cargo_args: "--no-default-features"
            setup_script: setup\Stremio-arm64.iss
            setup_glob: StremioSetup-v*_arm64.exe
            include_steam: false

    steps:
      - name: Disable git eol translation
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Inno Setup translations
        shell: pwsh
        run: |
          $languageDir = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\Languages"
          $languages = @(
            "Armenian",
            "BrazilianPortuguese",
            "Bulgarian",
            "Catalan",
            "Corsican",
            "Czech",
            "Danish",
            "Dutch",
            "Finnish",
            "French",
            "German",
            "Hebrew",
            "Icelandic",
            "Italian",
            "Japanese",
            "Norwegian",
            "Polish",
            "Portuguese",
            "Russian",
            "Slovak",
            "Slovenian",
            "Spanish",
            "Turkish",
            "Ukrainian"
          )

          foreach ($language in $languages) {
            $target = Join-Path $languageDir "$language.isl"
            if (Test-Path -LiteralPath $target) {
              continue
            }

            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$language.isl"
            curl.exe --fail --location --silent --show-error --output $target $url
          }

      - name: Embed release candidate version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          $manifestPath = Resolve-Path "Cargo.toml"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          $pattern = '(?m)^version = "[^"]+"'
          if ([regex]::Matches($manifest, $pattern).Count -eq 0) {
            throw "Could not find the package version in Cargo.toml"
          }

          $updatedManifest = [regex]::Replace(
            $manifest,
            $pattern,
            "version = `"$env:PACKAGE_VERSION`"",
            1
          )
          [IO.File]::WriteAllText(
            $manifestPath,
            $updatedManifest,
            [Text.UTF8Encoding]::new($false)
          )

          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $actualVersion = ($metadata.packages | Where-Object name -eq "stremio-shell-ng").version
          if ($actualVersion -ne $env:PACKAGE_VERSION) {
            throw "Expected package version $env:PACKAGE_VERSION, got $actualVersion"
          }
          Write-Host "Building package version $actualVersion"

      - name: Build shell
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_args }}

      - name: Build setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "${{ matrix.setup_script }}"

      - name: Package portable zip
        shell: pwsh
        run: |
          $includeSteam = "${{ matrix.include_steam }}" -eq "true"
          .\scripts\package-portable.ps1 `
            -Target "${{ matrix.target }}" `
            -OutputPath "artifacts\StremioRPCPortable.zip" `
            -IncludeSteam:$includeSteam

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: StremioSetup-${{ matrix.arch }}
          path: ${{ matrix.setup_glob }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: StremioRPCPortable-${{ matrix.arch }}
          path: artifacts\StremioRPCPortable.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release candidate
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          find artifacts -type f -name 'StremioSetup-v*_x64.exe' -exec cp '{}' dist/ \;
          find artifacts -type f -name 'StremioSetup-v*_arm64.exe' -exec cp '{}' dist/ \;
          cp artifacts/StremioRPCPortable-x64/StremioRPCPortable.zip dist/StremioRPCPortable_x64.zip
          cp artifacts/StremioRPCPortable-arm64/StremioRPCPortable.zip dist/StremioRPCPortable_arm64.zip

          echo "Release assets:"
          ls -la dist

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          RC_NUMBER: ${{ needs.prepare.outputs.rc_number }}
        run: |
          set -euo pipefail

          title="Stremio RPC ${RELEASE_VERSION} RC${RC_NUMBER}"
          notes="Release candidate ${RC_NUMBER} for v${RELEASE_VERSION}. Embedded app version: ${PACKAGE_VERSION}."

          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
