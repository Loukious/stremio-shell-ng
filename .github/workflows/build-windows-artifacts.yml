name: Build Windows artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
            cargo_args: ""
            setup_script: setup\Stremio.iss
            setup_glob: StremioSetup-v*_x64.exe
            include_steam: true
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            cargo_args: "--no-default-features"
            setup_script: setup\Stremio-arm64.iss
            setup_glob: StremioSetup-v*_arm64.exe
            include_steam: false

    steps:
      - name: Disable git eol translation
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Inno Setup translations
        shell: pwsh
        run: |
          $languageDir = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\Languages"
          $languages = @(
            "Armenian",
            "BrazilianPortuguese",
            "Bulgarian",
            "Catalan",
            "Corsican",
            "Czech",
            "Danish",
            "Dutch",
            "Finnish",
            "French",
            "German",
            "Hebrew",
            "Icelandic",
            "Italian",
            "Japanese",
            "Norwegian",
            "Polish",
            "Portuguese",
            "Russian",
            "Slovak",
            "Slovenian",
            "Spanish",
            "Turkish",
            "Ukrainian"
          )

          foreach ($language in $languages) {
            $target = Join-Path $languageDir "$language.isl"
            if (Test-Path -LiteralPath $target) {
              continue
            }

            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$language.isl"
            curl.exe --fail --location --silent --show-error --output $target $url
          }

      - name: Build shell
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_args }}

      - name: Build setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "${{ matrix.setup_script }}"

      - name: Package portable zip
        shell: pwsh
        run: |
          $includeSteam = "${{ matrix.include_steam }}" -eq "true"
          .\scripts\package-portable.ps1 `
            -Target "${{ matrix.target }}" `
            -OutputPath "artifacts\StremioRPCPortable.zip" `
            -IncludeSteam:$includeSteam

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: StremioSetup-${{ matrix.arch }}
          path: ${{ matrix.setup_glob }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: StremioRPCPortable-${{ matrix.arch }}
          path: artifacts\StremioRPCPortable.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release candidate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          find artifacts -type f -name 'StremioSetup-v*_x64.exe' -exec cp '{}' dist/ \;
          find artifacts -type f -name 'StremioSetup-v*_arm64.exe' -exec cp '{}' dist/ \;
          cp artifacts/StremioRPCPortable-x64/StremioRPCPortable.zip dist/StremioRPCPortable_x64.zip
          cp artifacts/StremioRPCPortable-arm64/StremioRPCPortable.zip dist/StremioRPCPortable_arm64.zip

          echo "Release assets:"
          ls -la dist

      - name: Choose release candidate tag
        id: rc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          base_tag="v${version}"
          current_tag=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            current_tag="${GITHUB_REF_NAME}"
          fi

          if [[ "$current_tag" =~ ^v[0-9]+(\.[0-9A-Za-z-]+)*-rc[0-9]+$ ]]; then
            release_tag="$current_tag"
            version="${release_tag#v}"
            version="${version%-rc*}"
          else
            git fetch --tags --force
            existing_numbers="$(
              {
                git tag -l "${base_tag}-rc*" | sed -En "s/^${base_tag}-rc([0-9]+)$/\1/p"
                gh release list --limit 200 --json tagName --jq '.[].tagName' \
                  | sed -En "s/^${base_tag}-rc([0-9]+)$/\1/p"
              } | sort -n | uniq
            )"
            last_number="$(printf '%s\n' "$existing_numbers" | tail -n 1)"
            if [[ -z "$last_number" ]]; then
              next_number=1
            else
              next_number=$((last_number + 1))
            fi
            release_tag="${base_tag}-rc${next_number}"

            if ! git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              git tag "$release_tag" "$GITHUB_SHA"
              git push origin "refs/tags/${release_tag}"
            fi
          fi

          rc_number="${release_tag##*-rc}"
          {
            echo "version=${version}"
            echo "tag=${release_tag}"
            echo "rc_number=${rc_number}"
          } >> "$GITHUB_OUTPUT"

          echo "Selected release candidate: ${release_tag}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rc.outputs.tag }}
          RELEASE_VERSION: ${{ steps.rc.outputs.version }}
          RC_NUMBER: ${{ steps.rc.outputs.rc_number }}
        run: |
          set -euo pipefail

          title="Stremio RPC ${RELEASE_VERSION} RC${RC_NUMBER}"
          notes="Release candidate ${RC_NUMBER} for v${RELEASE_VERSION}."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber
